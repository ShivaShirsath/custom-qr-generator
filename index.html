<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Custom QR Generator</title>
    <meta
      name="description"
      content="Free, open-source QR code generator. Style dots and eyes, add gradients, logos and frames, and download as SVG, PNG, JPEG or WebP. Static codes, no tracking, no redirects."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b1f" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Custom QR Generator" />
    <meta
      property="og:description"
      content="Design beautiful static QR codes with logos, gradients and frames. Free and open source."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Custom QR Generator needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
